<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ProCoat Painting</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body {
            background: var(--primary-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 15px 30px;
        }
    </style>
</head>
<body>
    <div class="position-absolute top-0 end-0 p-3 p-md-4 d-flex gap-2 z-3">
        <button id="rtl-toggle" class="btn btn-outline-fest nav-icon-btn fw-bold" style="font-size: 0.8rem;">RTL</button>
        <button id="theme-toggle" class="btn btn-outline-fest nav-icon-btn"><i class="bi bi-moon-stars-fill"></i></button>
    </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="service-card p-3 p-md-5 shadow-lg border-0" style="background: var(--card-bg);">
                    <div class="text-center mb-5">
                        <a class="navbar-brand d-flex align-items-center justify-content-center gap-2 mb-4" href="index.html" style="text-decoration: none;">
                            <svg width="48" height="48" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M25 5C25 5 10 18 10 30C10 38.284 16.716 45 25 45C33.284 45 40 38.284 40 30C40 18 25 5 25 5Z" fill="url(#paint_login)"/>
                                <rect x="18" y="18" width="14" height="7" rx="2" fill="white"/>
                                <path d="M16 21.5H14V30C14 31.105 14.895 32 16 32H25V35" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                                <rect x="23" y="35" width="4" height="5" rx="1" fill="white"/>
                                <defs>
                                    <linearGradient id="paint_login" x1="10" y1="25" x2="40" y2="25" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#1E3A8A"/>
                                        <stop offset="1" stop-color="#3B82F6"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                            <span class="fs-2 fw-bolder mb-0" style="color: #1E3A8A; letter-spacing: -1px; font-family: 'Inter', sans-serif;">Pro<span style="color: #3B82F6;">Coat</span></span>
                        </a>
                        <h2 class="fw-bold">Welcome Back</h2>
                        <p class="text-muted">Let's get the project started.</p>
                    </div>
                    <form>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control rounded-pill p-3 border-primary" placeholder="email@example.com">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control rounded-start-pill p-3 border-primary border-end-0" placeholder="********" id="loginPassword">
                                <span class="input-group-text bg-transpahire border-primary border-start-0 rounded-end-pill pe-4" style="cursor: pointer;" onclick="const input = document.getElementById('loginPassword'); const icon = this.querySelector('i'); if(input.type === 'password') { input.type = 'text'; icon.classList.replace('bi-eye', 'bi-eye-slash'); } else { input.type = 'password'; icon.classList.replace('bi-eye-slash', 'bi-eye'); }">
                                    <i class="bi bi-eye text-muted"></i>
                                </span>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4 flex-nowrap">
                            <div class="form-check mb-0">
                                <input class="form-check-input border-primary" type="checkbox" id="rememberMe">
                                <label class="form-check-label text-muted small text-nowrap" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="small fw-bold hover-highlight text-nowrap ms-2">Forgot Password?</a>
                        </div>
                        <button type="submit" class="btn btn-project btn-primary-fest w-100 py-3 mb-4">Login</button>
                        
                        <div class="position-relative mb-4 text-center">
                            <hr class="text-muted opacity-25">
                            <span class="position-absolute top-50 start-50 translate-middle px-2 text-muted small text-nowrap" style="background: var(--card-bg); font-size: 0.75rem;">Or continue with</span>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-fest w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-google"></i> Google
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-fest w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-apple"></i> Apple
                                </button>
                            </div>
                        </div>

                        <div class="text-center">
                            <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="fw-bold hover-highlight">Register Now</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
